# SIDERA standalone: resident core below $C800, C stack at $F700-$FEFF.
# Keep the native RP6502 crt0 RAM symbols: they also set the stack pointer.
SYMBOLS {
    __STARTUP__: type = import;
    __STACKSIZE__: type = weak, value = $0800;
    __RAM_START__: type = export, value = $0200;
    __RAM_SIZE__: type = export, value = $FD00 - __STACKSIZE__;
}
MEMORY {
    ZP: file = "", define = yes, start = $0000, size = $0100;
    MAIN: file = %O, define = yes, start = $0200, size = $C600;
    BSS: file = "", start = __ONCE_RUN__, size = $C800 - __ONCE_RUN__;
    INITMEM: file = "%O.linked.bin.init", define = yes, start = $C800, size = $1700;
    CITIESMEM: file = "%O.linked.bin.cities", define = yes, start = $C800, size = $1700;
    EDITMEM: file = "%O.linked.bin.edit", define = yes, start = $C800, size = $1700;
    SOLARMEM: file = "%O.linked.bin.solar", define = yes, start = $C800, size = $1700;
    COVERMEM: file = "%O.linked.bin.cover", define = yes, start = $C800, size = $1700;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    STARTUP: load = MAIN, type = ro;
    LOWCODE: load = MAIN, type = ro, optional = yes;
    CODE: load = MAIN, type = ro;
    RODATA: load = MAIN, type = ro;
    DATA: load = MAIN, type = rw;
    INIT: load = MAIN, type = rw, optional = yes;
    ONCE: load = MAIN, type = ro, define = yes;
    BSS: load = BSS, type = bss, define = yes;
    INIT_CODE: load = INITMEM, type = ro, define = yes, optional = yes;
    INIT_RODATA: load = INITMEM, type = ro, define = yes, optional = yes;
    INIT_DATA: load = INITMEM, type = rw, define = yes, optional = yes;
    INIT_BSS: load = INITMEM, type = bss, define = yes, optional = yes;
    CITIES_CODE: load = CITIESMEM, type = ro, define = yes, optional = yes;
    CITIES_RODATA: load = CITIESMEM, type = ro, define = yes, optional = yes;
    CITIES_DATA: load = CITIESMEM, type = rw, define = yes, optional = yes;
    CITIES_BSS: load = CITIESMEM, type = bss, define = yes, optional = yes;
    EDIT_CODE: load = EDITMEM, type = ro, define = yes, optional = yes;
    EDIT_RODATA: load = EDITMEM, type = ro, define = yes, optional = yes;
    EDIT_DATA: load = EDITMEM, type = rw, define = yes, optional = yes;
    EDIT_BSS: load = EDITMEM, type = bss, define = yes, optional = yes;
    SOLAR_CODE: load = SOLARMEM, type = ro, define = yes, optional = yes;
    SOLAR_RODATA: load = SOLARMEM, type = ro, define = yes, optional = yes;
    SOLAR_DATA: load = SOLARMEM, type = rw, define = yes, optional = yes;
    SOLAR_BSS: load = SOLARMEM, type = bss, define = yes, optional = yes;
    COVER_CODE: load = COVERMEM, type = ro, define = yes, optional = yes;
    COVER_RODATA: load = COVERMEM, type = ro, define = yes, optional = yes;
    COVER_DATA: load = COVERMEM, type = rw, define = yes, optional = yes;
    COVER_BSS: load = COVERMEM, type = bss, define = yes, optional = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__, count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
